// Este é o caminho onde está esse arquivo: app/src/main/com/example/pokerpote/proto/datastore/game_state.proto
syntax = "proto3";

// Define o namespace e nome da classe Kotlin gerada
option java_package = "com.example.pokerpote.proto.datastore";
option java_multiple_files = true;

// Mensagem representando um jogador individual
message PlayerProto {
  string name = 1;
  double total_buy_in = 2;
}

// Mensagem principal representando o estado completo do jogo a ser salvo
message GameStateProto {
  bool is_game_active = 1; // INDICA SE HÁ UM JOGO SALVO ATIVO

  // --- Configurações Iniciais (ou Atuais se dinâmico) ---
  double multiplier = 2;
  double initial_min_buy_in = 3; // O mínimo definido na configuração
  int32 initial_bb = 4;         // O BB mínimo definido na configuração
  double initial_stack_depth = 5;
  bool dynamic_updates_enabled = 6;
  double bb_rate = 7;

  // --- Estado Atual do Jogo ---
  double current_min_buy_in = 8; // O mínimo que pode ter sido atualizado
  int32 current_bb = 9;          // O BB atual em fichas
  double sum_buy_ins = 10;        // Total R$ de buy-ins
  double cash_out_total = 11;     // Total R$ de cash-outs
  int32 entries_count = 12;       // Contador interno para regra dinâmica

  // Lista de jogadores atualmente na mesa
  repeated PlayerProto players = 13;
}